<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>報名後台</title>
<!-- 分享縮圖（LINE／Facebook 預覽）；圖由 tools/make_share.py 產生 og-admin.jpg -->
<meta name="description" content="青銀飛行趣報名後台：新竹市無人機創新科技協會成員用 Google 帳號登入，查看各社區報名名單、複製報名連結與 DM 圖。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="新竹市無人機創新科技協會">
<meta property="og:locale" content="zh_TW">
<meta property="og:url" content="https://greenmail1011.github.io/community-signup/admin.html">
<meta property="og:title" content="青銀飛行趣｜報名後台（協會成員登入）">
<meta property="og:description" content="新竹市無人機創新科技協會成員用 Google 帳號登入，查看各社區報名名單、複製報名連結與 DM 圖。">
<meta property="og:image" content="https://greenmail1011.github.io/community-signup/og-admin.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="青銀飛行趣報名後台">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="青銀飛行趣｜報名後台（協會成員登入）">
<meta name="twitter:image" content="https://greenmail1011.github.io/community-signup/og-admin.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{
  /* 與報名頁同一套：天空藍、寶藍、射門圈橘 */
  --bg:#EAF4FF; --panel:#FFFFFF; --soft:#FFF5CC; --sky:#EAF4FF;
  --text:#0E2A5E; --muted:#3A4D73; --border:#C9DCF7;
  --blue:#1F5FD1; --orange:#C24F00; --ring:#F26B0F; --line:#04913D; --err:#C0261B; --ok:#15803D;
  --f:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.6;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-top:18px;display:flex;flex-direction:column;gap:18px}

.top{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));color:#FFFFFF;position:sticky;top:0;z-index:5;
  background:var(--text);border-top:6px solid var(--blue)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px}
.top h1{font-size:17px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
.role{font-size:13px;font-weight:700;background:#FFD43B;color:var(--text);border-radius:999px;padding:1px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.top .sp{flex:1 1 0;min-width:0}
.top button{font:inherit;font-size:14px;font-weight:700;color:#FFFFFF;background:transparent;border:1.5px solid rgba(255,255,255,.5);border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap;flex:0 0 auto}

.card{background:var(--panel);border:0;border-radius:18px;padding:20px 16px;box-shadow:0 8px 24px -16px rgba(14,42,94,.45)}
.card h2{font-size:19px;font-weight:900;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}

/* login */
.login{max-width:420px;margin:48px auto 0;display:flex;flex-direction:column;gap:14px}
.login h2{margin:0;font-size:24px}
input[type=password],input[type=text],input[type=search]{width:100%;font:inherit;font-size:18px;color:var(--text);border:2px solid var(--border);border-radius:12px;padding:10px 12px;min-height:50px;background:#FFFFFF}
input:focus{border-color:var(--blue);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:0;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--ring);color:#FFFFFF;font-size:19px;min-height:54px;border-radius:999px;box-shadow:0 4px 0 #C24F00;letter-spacing:.1em}
.btn-ghost{background:#FFFFFF;color:var(--blue);border:1.5px solid #B9CDEB}
.btn-ghost:hover{background:var(--sky)}
.btn-sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn-sheet{background:#188038;color:#FFFFFF}
.btn-sheet:hover{background:#136C2E}
.btn-sheet::before{content:"";width:14px;height:16px;border-radius:2px;background:#FFFFFF;box-shadow:inset 0 -5px 0 #A8DAB5,inset 0 -10px 0 #FFFFFF,inset 0 -11px 0 #A8DAB5;flex:0 0 auto}
.err{color:var(--err);font-weight:700}
.g-box{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.g-btn{min-height:44px;display:flex;justify-content:center}
.pw-box{border-top:2px dashed var(--border);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.pw-box summary{cursor:pointer;color:var(--muted);font-weight:700;text-align:center;list-style-position:inside}
.pw-box[open]{gap:10px}
.pw-box[open]>*:not(summary){display:block;margin-top:10px}
.pw-box .btn{display:flex;width:100%}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:0;border-radius:16px;box-shadow:0 6px 18px -14px rgba(14,42,94,.5);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{color:var(--muted);font-weight:700;font-size:13px}
.stat b{font-size:28px;font-weight:900;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* communities (admin) */
.comms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-items:start}
.comm{border:2px solid var(--border);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:#FFFFFF}
.comm-h{display:flex;align-items:center;gap:8px}
.comm-h h3{flex:1;font-size:17px;font-weight:900;display:flex;align-items:center;gap:8px;min-width:0}
.comm-h h3 .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.seq{flex:none;font-size:12px;font-weight:900;color:var(--blue);border:1.5px solid var(--blue);border-radius:999px;padding:1px 8px;line-height:1.4}
.seq.next{color:#FFFFFF;background:var(--ring);border-color:var(--ring)}
/* 標題列＋呈現方式切換 */
.comm-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.comm-top h2{margin:0}
.views{margin-left:auto;display:inline-flex;border:2px solid var(--blue);border-radius:999px;overflow:hidden}
.views button{font:inherit;font-size:14px;font-weight:700;padding:5px 14px;border:0;background:#FFFFFF;color:var(--blue);cursor:pointer}
.views button+button{border-left:2px solid var(--blue)}
.views button[aria-pressed="true"]{background:var(--blue);color:#FFFFFF}
/* 下一場橫幅 */
.hero-next{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;padding:14px 16px;border-radius:16px;color:#FFFFFF;background:linear-gradient(120deg,#F26B0F,#FF9A3D);box-shadow:0 10px 22px -12px rgba(242,107,15,.8)}
.hero-next:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hn-k{font-size:13px;font-weight:900;background:#FFFFFF;color:#C24F00;border-radius:999px;padding:3px 12px}
.hn-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hn-name{font-size:20px;font-weight:900}
.hn-time{font-size:17px;font-weight:700}
.hn-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin-left:auto}
.hn-days{font-size:22px;font-weight:900}
.hn-cnt{font-size:14px;font-weight:700;opacity:.95}
/* 清單裡的下一場卡片 */
.comm.is-next{border:3px solid var(--ring);background:#FFF6EE}
.comm.is-next .when{font-size:19px;color:#C24F00}
.dleft{flex:none;font-size:12px;font-weight:900;color:#C24F00;background:#FFE3CC;border-radius:999px;padding:1px 8px}
.comm.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px rgba(31,95,209,.45)}100%{box-shadow:none}}
/* 週／月曆 */
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-nav b{font-size:17px;min-width:9em;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--border);gap:1px}
.cal-h{background:#F3F7FC;text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-d{background:#FFFFFF;min-height:86px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-grid.week .cal-d{min-height:180px}
.cal-d.out{background:#F8FAFC}.cal-d.out .cal-n{opacity:.45}
.cal-n{font-size:12px;font-weight:700;color:var(--muted)}
.cal-d.today .cal-n{color:#FFFFFF;background:var(--blue);border-radius:999px;padding:0 7px;align-self:flex-start}
.ev{font:inherit;text-align:left;cursor:pointer;border:0;border-radius:6px;padding:3px 5px;font-size:12px;line-height:1.3;background:#E3EDFF;color:#0E2A5E;display:flex;flex-wrap:wrap;gap:0 4px;min-width:0}
.ev-t{font-weight:900}.ev-n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ev.next{background:var(--ring);color:#FFFFFF;box-shadow:0 0 0 2px #FFD2AE}
.ev-k{width:100%;font-size:11px}
.ev.done{background:#E9EDF2;color:#7A879B}
.cal-grid.week .ev{font-size:13px;flex-direction:column;flex-wrap:nowrap}
.cal-grid.week .ev-n{white-space:normal}
@media (max-width:640px){.hero-next{gap:8px 12px}.hn-name{font-size:18px}.hn-time{font-size:15px}.hn-side{width:100%;flex-direction:row;justify-content:space-between;align-items:baseline}.hn-days{font-size:19px}.ev-k{white-space:nowrap}.cal-d{min-height:64px}.ev-t{display:none}.cal-grid.week .cal-d{min-height:120px}}
/* 進行中（左）／已完成（右）並排；手機改上下 */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.split .comms{grid-template-columns:1fr;gap:8px}
.col{min-width:0}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.comm-h .cnt{margin-left:auto;font-weight:900;color:var(--ring);font-size:19px;white-space:nowrap;line-height:1.2}
.kv{line-height:1.5}
.when{font-size:17px;font-weight:900;color:#0E2A5E}
.comm.done .when{color:#5B6779}
.tag{font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;border:1.5px solid}
.tag.on{color:var(--ok);border-color:var(--ok)}
.tag.off{color:var(--muted);border-color:#B8C3CE}
.tag.warn{color:var(--err);border-color:var(--err)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;word-break:break-all}
.dm-wait{background:#F1F3F6;color:#7A879B;border:1.5px dashed #B8C3CE;cursor:default}
.row-btns{display:flex;flex-wrap:wrap;gap:6px}
.more>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}
.more>summary::-webkit-details-marker{display:none}
.more .tog{margin-left:auto;flex:none;font-size:13px;font-weight:700;color:var(--blue);white-space:nowrap}
.more .tog::before{content:"▸ ";display:inline-block;transition:transform .15s}
.more[open] .tog::before{transform:rotate(90deg)}
.more[open] .lbl-open,.more:not([open]) .lbl-close{display:none}
.more .kv{margin:8px 0;padding-top:8px;border-top:1.5px dashed var(--border)}
/* 進行中／已完成：用色塊標籤＋已完成整區灰底，一眼分開 */
.grp{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:900;margin:6px 0 12px}
.grp::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--blue)}
.grp .n{font-size:13px;font-weight:700;color:#FFFFFF;background:var(--blue);border-radius:999px;padding:1px 10px}
.grp.done{color:#5B6779}
.grp.done::before{background:#9AA6B6}
.grp.done .n{background:#9AA6B6}
.col-done{background:#EEF2F7;border-radius:16px;padding:12px}
.col-done .grp{margin-top:0}
.comm.done{background:#F6F8FB;border-color:#DCE3EC}
.tag.end{color:#FFFFFF;background:#7A879B;border-color:#7A879B}

/* toolbar + list */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input{flex:1 1 220px;min-height:44px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--border);background:#FFFFFF;color:var(--text);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#FFFFFF}
.list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;padding:12px 4px;border-top:1px solid var(--border)}
.item .no{font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.item .who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.item .who b{font-size:18px}
.item .meta{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:14px}
.item .tel{font-weight:700;font-variant-numeric:tabular-nums;text-decoration:none;font-size:17px;white-space:nowrap}
.item .cn{font-size:12px;font-weight:700;background:var(--sky);color:var(--blue);border-radius:4px;padding:0 6px}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

dialog{border:0;border-radius:16px;padding:20px;max-width:min(92vw,420px);text-align:center}
dialog::backdrop{background:rgba(10,20,40,.6)}
dialog h3{font-size:20px;margin-bottom:4px}
.qr-big{width:260px;height:260px;margin:14px auto;display:block}
.qr-big svg{width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#FFFFFF;padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <h1>報名後台</h1><span class="role" id="role" hidden></span>
  <span class="sp"></span>
  <button type="button" id="refresh" hidden>更新</button>
  <button type="button" id="logout" hidden>登出</button>
</div></div>

<main class="wrap">

  <form class="card login" id="login">
    <h2>登入報名後台</h2>
    <div class="g-box">
      <p class="muted"><b id="org-name">新竹市無人機創新科技協會</b>成員<br>請用 Google 帳號登入</p>
      <div class="g-btn" id="g-btn"><span class="muted">Google 登入按鈕載入中…</span></div>
      <p class="err" id="g-err" role="alert" hidden></p>
    </div>
    <details class="pw-box" id="pw-box">
      <summary>沒辦法用 Google 登入？改用備用密碼</summary>
      <label for="key" class="muted" style="font-weight:700">備用密碼</label>
      <input type="password" id="key" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      <p class="err" id="login-err" role="alert" hidden></p>
      <button class="btn btn-primary" id="login-btn" type="submit">登入</button>
    </details>
  </form>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:18px">

    <section class="stats" id="stats" aria-label="報名統計"></section>

    <section class="card" id="comm-card" hidden>
      <div class="comm-top">
        <h2>各社區報名頁</h2>
        <div class="views" role="group" aria-label="呈現方式">
          <button type="button" data-v="list">清單</button><button type="button" data-v="week">週</button><button type="button" data-v="month">月</button>
        </div>
      </div>
      <!-- 下一場：最醒目的橫幅，點了展開那張卡片 -->
      <div id="next-hero"></div>
      <!-- 週／月曆 -->
      <div id="cal" hidden></div>
      <!-- 清單：依活動時間自動分組：進行中（近→遠）、已完成（新→舊）；活動結束時間一過就移到已完成 -->
      <div class="split" id="list-view">
        <div class="col">
          <h3 class="grp" id="grp-up">進行中 <span class="n" id="n-up"></span></h3>
          <div class="comms" id="comms"></div>
        </div>
        <div class="col col-done">
          <h3 class="grp done" id="grp-done">已完成 <span class="n" id="n-done"></span></h3>
          <div class="comms" id="comms-done"></div>
        </div>
      </div>
    </section>

    <section class="card" id="mine-card" hidden>
      <h2 id="mine-title"></h2>
      <dl class="kv" id="mine-kv"></dl>
    </section>

    <section class="card">
      <h2>報名名單</h2>
      <div class="chips" id="chips" hidden></div>
      <div class="toolbar">
        <input type="search" id="q" placeholder="搜尋姓名或手機" aria-label="搜尋">
        <button type="button" class="btn btn-ghost" id="csv">下載 Excel（CSV）</button>
        <button type="button" class="btn btn-ghost" id="phones">複製手機號碼</button>
        <a class="btn btn-sheet" id="sheet-btn" target="_blank" rel="noopener" hidden>開啟 Google 試算表</a>
      </div>
      <p class="muted" id="updated" style="margin-top:8px"></p>
      <ul class="list" id="list"></ul>
    </section>
  </div>
</main>

<dialog id="qr-dlg">
  <h3 id="qr-title"></h3>
  <p class="muted">手機掃描即可開啟報名頁</p>
  <div class="qr-big" id="qr-big" role="img" aria-label="報名頁 QR code"></div>
  <p class="muted" id="qr-url" style="word-break:break-all"></p>
  <div class="row-btns" style="justify-content:center;margin-top:12px">
    <a class="btn btn-ghost btn-sm" id="qr-dl" download>下載 QR 圖</a>
    <button type="button" class="btn btn-ghost btn-sm" id="qr-close">關閉</button>
  </div>
</dialog>

<script src="config.js?v=22"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
  const CFG = window.APP_CONFIG || {};
  const API = CFG.API_URL || "";
  const $ = s => document.querySelector(s);
  const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props || {}); kids.forEach(k => k != null && e.append(k)); return e; };
  const SKEY = "community-signup-key";
  const ss = {
    // 記在這台裝置（localStorage），關掉瀏覽器也不用重新登入；按「登出」才清掉。
    // 存 {key:"密碼"} 或 {session:"Google 登入後發的記住登入憑證"}；舊版存在 sessionStorage、或只存密碼字串
    get(){
      let v = "";
      try { v = localStorage.getItem(SKEY) || ""; } catch(e) {}
      if (!v) { try { v = sessionStorage.getItem(SKEY) || ""; } catch(e) {} }
      if (!v) return null;
      try { const o = JSON.parse(v); if (o && typeof o === "object") return o; } catch(_) {}
      return {key:v};
    },
    set(v){ try { localStorage.setItem(SKEY, JSON.stringify(v)); } catch(e) {} },
    del(){ try { localStorage.removeItem(SKEY); } catch(e) {} try { sessionStorage.removeItem(SKEY); } catch(e) {} }
  };
  let CRED = null, DATA = null, FILTER = "all";

  function toast(t){
    const d = el("div", {className:"toast", textContent:t}); document.body.append(d);
    setTimeout(() => d.remove(), 1800);
  }
  async function copy(t, okMsg){
    okMsg = okMsg || "已複製";
    try { await navigator.clipboard.writeText(t); toast(okMsg); }
    catch(e) {

  // 把圖片（DM 海報）放進剪貼簿，可直接貼到 LINE／FB；瀏覽器不支援就改成下載
  async function copyImage(url, filename){
    try {
      if (!window.ClipboardItem || !navigator.clipboard || !navigator.clipboard.write) throw new Error("no clipboard image");
      const png = (async () => {
        const r = await fetch(url, {cache:"no-store"});
        if (!r.ok) throw new Error("找不到 DM 圖");
        const bmp = await createImageBitmap(await r.blob());
        const cv = document.createElement("canvas"); cv.width = bmp.width; cv.height = bmp.height;
        cv.getContext("2d").drawImage(bmp, 0, 0);
        return await new Promise(res => cv.toBlob(res, "image/png"));
      })();
      await navigator.clipboard.write([new ClipboardItem({"image/png": png})]);
      toast("已複製 DM 圖，可以直接貼上");
    } catch(e) {
      const a = el("a", {href:url, download:filename}); document.body.append(a); a.click(); a.remove();
      toast("這個瀏覽器不能直接複製圖片，已改成下載");
    }
  }
  // 對外分享用網址：代碼/（有專屬 LINE／FB 縮圖，打開後自動進 ?c=代碼）。新增社區要跑 tools/make_share.py
  const regUrl = code => new URL("./" + encodeURIComponent(code) + "/", location.href).href;
  // 從「11/19（四）上午 10:00–11:00」解析出活動開始／結束時間（沒寫年份 → 取離今天最近的那一年；沒寫時間 → 當天 23:59 結束）
  function eventTime(s){
    s = String(s || "");
    const m = s.match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
    if (!m) return null;
    const mon = +m[1] - 1, day = +m[2], now = Date.now(), y0 = new Date().getFullYear();
    const pm = /下午|晚上/.test(s);
    const hm = [...s.slice(m.index + m[0].length).matchAll(/(\d{1,2}):(\d{2})/g)].map(x => [(+x[1]) + (pm && +x[1] < 12 ? 12 : 0), +x[2]]);
    let best = null;
    [y0 - 1, y0, y0 + 1].forEach(y => {
      const d = new Date(y, mon, day);
      if (!best || Math.abs(d - now) < Math.abs(best - now)) best = d;
    });
    const at = (h, mi) => { const d = new Date(best); d.setHours(h, mi, 0, 0); return d; };
    return { start: hm.length ? at(hm[0][0], hm[0][1]) : at(0, 0),
             end:   hm.length ? at(hm[hm.length - 1][0], hm[hm.length - 1][1]) : at(23, 59) };
  }
  // 社區依時間分組：進行中（近→遠，時間看不懂的排最後）、已完成（新→舊）
  function sortComms(list){
    const now = new Date(), up = [], done = [];
    list.forEach(c => { const t = eventTime(c.time); (t && t.end < now ? done : up).push({c, t}); });
    up.sort((a, b) => (a.t ? a.t.start : Infinity) - (b.t ? b.t.start : Infinity));
    done.sort((a, b) => b.t.start - a.t.start);
    return { up: up.map(x => x.c), done: done.map(x => x.c) };
  }

    const g = k => scope.filter(r => r.gender === k).length;
    const ages = scope.map(r => Number(r.age)).filter(a => a > 0);
    const band = (lo, hi) => ages.filter(a => a >= lo && a <= hi).length;
    const st = $("#stats"); st.innerHTML = "";
    [["報名人數", scope.length, "人"],
     ["男／女", g("男") + "／" + g("女"), g("不便透露") ? "不便透露 " + g("不便透露") : ""],
     ["65 歲以上", band(65, 200), "18–64 歲 " + band(18, 64)],
     ["17 歲以下", band(0, 17), ages.length ? "平均 " + (ages.reduce((a, b) => a + b, 0) / ages.length).toFixed(0) + " 歲" : ""]
    ].forEach(([k, v, s]) => st.append(el("div", {className:"stat"}, el("small", {textContent:k}), el("b", {className:"num", textContent:v}), el("span", {textContent:s}))));

    $("#updated").textContent = "共 " + rows.length + " 筆" + (rows.length !== scope.length ? "（搜尋結果）" : "") +
      "｜資料時間 " + DATA.at.toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"});

    const list = $("#list"); list.innerHTML = "";
    if (!rows.length) { list.append(el("li", {className:"empty", textContent: scope.length ? "找不到符合的資料" : "目前還沒有人報名"})); return; }
    rows.slice().reverse().forEach(r => {
      list.append(el("li", {className:"item"},
        el("span", {className:"no", textContent:"#" + r.no}),
        el("div", {className:"who"},
          el("b", {textContent:r.name}),
          el("span", {textContent:[r.gender, r.age ? r.age + " 歲" : ""].filter(Boolean).join("・")}),
          admin && FILTER === "all" ? el("span", {className:"cn", textContent:r.cname}) : null),
        el("a", {className:"tel", href:"tel:" + r.phone, textContent:fmtPhone(r.phone)}),
        el("div", {className:"meta"},
          el("span", {textContent:"報名 " + String(r.time).slice(5, 16)}))
      ));
    });
  }

  $("#q").addEventListener("input", () => DATA && renderList());

  $("#csv").addEventListener("click", () => {
    const rows = rowsInView();
    const head = ["報名編號", "社區", "姓名", "性別", "年齡", "手機", "報名時間"];
    const esc = v => { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    // 手機加 ="..." 讓 Excel 保留開頭的 0
    const lines = [head.join(",")].concat(rows.map(r => [r.no, r.cname, r.name, r.gender, r.age, '="' + r.phone + '"', r.time].map((v, i) => i === 5 ? v : esc(v)).join(",")));
    const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
    const name = (DATA.role === "admin" && FILTER === "all" ? "全部社區" : (DATA.communities.find(c => c.code === (FILTER === "all" ? DATA.communities[0].code : FILTER)) || {}).name || "報名") +
      "_報名名單_" + new Date().toISOString().slice(0, 10) + ".csv";
    const a = el("a", {href:URL.createObjectURL(blob), download:name}); document.body.append(a); a.click(); a.remove();
  });

  $("#phones").addEventListener("click", () => {
    const rows = rowsInView();
    if (!rows.length) return toast("沒有資料");
    copy(rows.map(r => r.name + " " + fmtPhone(r.phone)).join("\n"));
  });

  // QR
  const dlg = $("#qr-dlg");
  function openQr(name, url, code){
    $("#qr-title").textContent = name;
    $("#qr-url").textContent = url;
    try {
      const q = qrcode(0, "M"); q.addData(url); q.make();
      $("#qr-big").innerHTML = q.createSvgTag({cellSize:8, margin:2, scalable:true});
      $("#qr-dl").href = q.createDataURL(10, 4);
      $("#qr-dl").download = name + "_報名QR.gif";
    } catch(e) { $("#qr-big").textContent = "QR 產生失敗"; }
    try { dlg.showModal(); } catch(e) {}
  }
  $("#qr-close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

  const saved = ss.get();
  if (saved && (saved.key || saved.idToken || saved.session)) login(saved, true);
})();
</script>
</body>
</html>
