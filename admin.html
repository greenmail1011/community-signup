<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>報名後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
:root{
  /* 與報名頁同一套：天空藍、寶藍、射門圈橘 */
  --bg:#EAF4FF; --panel:#FFFFFF; --soft:#FFF5CC; --sky:#EAF4FF;
  --text:#0E2A5E; --muted:#3A4D73; --border:#C9DCF7;
  --blue:#1F5FD1; --orange:#C24F00; --ring:#F26B0F; --line:#04913D; --err:#C0261B; --ok:#15803D;
  --f:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;line-height:1.6;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:980px;margin:0 auto;padding-top:18px;display:flex;flex-direction:column;gap:18px}

.top{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));color:#FFFFFF;position:sticky;top:0;z-index:5;
  background:var(--text);border-top:6px solid var(--blue)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px}
.top h1{font-size:17px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
.role{font-size:13px;font-weight:700;background:#FFD43B;color:var(--text);border-radius:999px;padding:1px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.top .sp{flex:1 1 0;min-width:0}
.top button{font:inherit;font-size:14px;font-weight:700;color:#FFFFFF;background:transparent;border:1.5px solid rgba(255,255,255,.5);border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap;flex:0 0 auto}

.card{background:var(--panel);border:0;border-radius:18px;padding:20px 16px;box-shadow:0 8px 24px -16px rgba(14,42,94,.45)}
.card h2{font-size:19px;font-weight:900;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}

/* login */
.login{max-width:420px;margin:48px auto 0;display:flex;flex-direction:column;gap:14px}
.login h2{margin:0;font-size:24px}
input[type=password],input[type=text],input[type=search]{width:100%;font:inherit;font-size:18px;color:var(--text);border:2px solid var(--border);border-radius:12px;padding:10px 12px;min-height:50px;background:#FFFFFF}
input:focus{border-color:var(--blue);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:0;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--ring);color:#FFFFFF;font-size:19px;min-height:54px;border-radius:999px;box-shadow:0 4px 0 #C24F00;letter-spacing:.1em}
.btn-ghost{background:#FFFFFF;color:var(--blue);border:1.5px solid #B9CDEB}
.btn-ghost:hover{background:var(--sky)}
.btn-sm{min-height:36px;padding:4px 10px;font-size:14px}
.btn-sheet{background:#188038;color:#FFFFFF}
.btn-sheet:hover{background:#136C2E}
.btn-sheet::before{content:"";width:14px;height:16px;border-radius:2px;background:#FFFFFF;box-shadow:inset 0 -5px 0 #A8DAB5,inset 0 -10px 0 #FFFFFF,inset 0 -11px 0 #A8DAB5;flex:0 0 auto}
.err{color:var(--err);font-weight:700}
.g-box{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.g-btn{min-height:44px;display:flex;justify-content:center}
.pw-box{border-top:2px dashed var(--border);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.pw-box summary{cursor:pointer;color:var(--muted);font-weight:700;text-align:center;list-style-position:inside}
.pw-box[open]{gap:10px}
.pw-box[open]>*:not(summary){display:block;margin-top:10px}
.pw-box .btn{display:flex;width:100%}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:0;border-radius:16px;box-shadow:0 6px 18px -14px rgba(14,42,94,.5);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat small{color:var(--muted);font-weight:700;font-size:13px}
.stat b{font-size:28px;font-weight:900;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* communities (admin) */
.comms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.comm{border:2px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;background:#FFFFFF}
.comm-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.comm-h h3{font-size:18px;font-weight:900}
.comm-h .cnt{margin-left:auto;font-weight:900;color:var(--ring);font-size:22px}
.tag{font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;border:1.5px solid}
.tag.on{color:var(--ok);border-color:var(--ok)}
.tag.off{color:var(--muted);border-color:#B8C3CE}
.tag.warn{color:var(--err);border-color:var(--err)}
.kv{display:grid;grid-template-columns:72px 1fr;gap:2px 8px;font-size:14px;margin:0}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;word-break:break-all}
.row-btns{display:flex;flex-wrap:wrap;gap:6px}

/* toolbar + list */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input{flex:1 1 220px;min-height:44px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--border);background:#FFFFFF;color:var(--text);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:#FFFFFF}
.list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:2px 12px;align-items:center;padding:12px 4px;border-top:1px solid var(--border)}
.item .no{font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.item .who{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;min-width:0}
.item .who b{font-size:18px}
.item .meta{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--muted);font-size:14px}
.item .tel{font-weight:700;font-variant-numeric:tabular-nums;text-decoration:none;font-size:17px;white-space:nowrap}
.item .cn{font-size:12px;font-weight:700;background:var(--sky);color:var(--blue);border-radius:4px;padding:0 6px}
.empty{padding:28px 0;text-align:center;color:var(--muted)}

dialog{border:0;border-radius:16px;padding:20px;max-width:min(92vw,420px);text-align:center}
dialog::backdrop{background:rgba(10,20,40,.6)}
dialog h3{font-size:20px;margin-bottom:4px}
.qr-big{width:260px;height:260px;margin:14px auto;display:block}
.qr-big svg{width:100%;height:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#FFFFFF;padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <h1>報名後台</h1><span class="role" id="role" hidden></span>
  <span class="sp"></span>
  <button type="button" id="refresh" hidden>更新</button>
  <button type="button" id="logout" hidden>登出</button>
</div></div>

<main class="wrap">

  <form class="card login" id="login">
    <h2>登入報名後台</h2>
    <div class="g-box">
      <p class="muted"><b id="org-name">新竹市無人機創新科技協會</b>成員<br>請用 Google 帳號登入</p>
      <div class="g-btn" id="g-btn"><span class="muted">Google 登入按鈕載入中…</span></div>
      <p class="err" id="g-err" role="alert" hidden></p>
    </div>
    <details class="pw-box" id="pw-box">
      <summary>沒辦法用 Google 登入？改用備用密碼</summary>
      <label for="key" class="muted" style="font-weight:700">備用密碼</label>
      <input type="password" id="key" autocomplete="current-password" autocapitalize="off" spellcheck="false">
      <p class="err" id="login-err" role="alert" hidden></p>
      <button class="btn btn-primary" id="login-btn" type="submit">登入</button>
    </details>
  </form>

  <div id="app" hidden style="display:flex;flex-direction:column;gap:18px">

    <section class="stats" id="stats" aria-label="報名統計"></section>

    <section class="card" id="comm-card" hidden>
      <h2>各社區報名頁</h2>
      <div class="comms" id="comms"></div>
    </section>

    <section class="card" id="mine-card" hidden>
      <h2 id="mine-title"></h2>
      <dl class="kv" id="mine-kv"></dl>
    </section>

    <section class="card">
      <h2>報名名單</h2>
      <div class="chips" id="chips" hidden></div>
      <div class="toolbar">
        <input type="search" id="q" placeholder="搜尋姓名或手機" aria-label="搜尋">
        <button type="button" class="btn btn-ghost" id="csv">下載 Excel（CSV）</button>
        <button type="button" class="btn btn-ghost" id="phones">複製手機號碼</button>
        <a class="btn btn-sheet" id="sheet-btn" target="_blank" rel="noopener" hidden>開啟 Google 試算表</a>
      </div>
      <p class="muted" id="updated" style="margin-top:8px"></p>
      <ul class="list" id="list"></ul>
    </section>
  </div>
</main>

<dialog id="qr-dlg">
  <h3 id="qr-title"></h3>
  <p class="muted">手機掃描即可開啟報名頁</p>
  <div class="qr-big" id="qr-big" role="img" aria-label="報名頁 QR code"></div>
  <p class="muted" id="qr-url" style="word-break:break-all"></p>
  <div class="row-btns" style="justify-content:center;margin-top:12px">
    <a class="btn btn-ghost btn-sm" id="qr-dl" download>下載 QR 圖</a>
    <button type="button" class="btn btn-ghost btn-sm" id="qr-close">關閉</button>
  </div>
</dialog>

<script src="config.js?v=6"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function(){
  const CFG = window.APP_CONFIG || {};
  const API = CFG.API_URL || "";
  const $ = s => document.querySelector(s);
  const el = (tag, props, ...kids) => { const e = Object.assign(document.createElement(tag), props || {}); kids.forEach(k => k != null && e.append(k)); return e; };
  const SKEY = "community-signup-key";
  const ss = {
    // 存 {key:"密碼"} 或 {idToken:"Google 登入憑證"}；舊版只存密碼字串
    get(){ try { const v = sessionStorage.getItem(SKEY) || ""; if (!v) return null; try { const o = JSON.parse(v); if (o && typeof o === "object") return o; } catch(_) {} return {key:v}; } catch(e) { return null; } },
    set(v){ try { sessionStorage.setItem(SKEY, JSON.stringify(v)); } catch(e) {} },
    del(){ try { sessionStorage.removeItem(SKEY); } catch(e) {} }
  };
  let CRED = null, DATA = null, FILTER = "all";

  function toast(t){
    const d = el("div", {className:"toast", textContent:t}); document.body.append(d);
    setTimeout(() => d.remove(), 1800);
  }
  async function copy(t){
    try { await navigator.clipboard.writeText(t); toast("已複製"); }
    catch(e) {
      const ta = el("textarea", {value:t}); document.body.append(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch(_) {}
      ta.remove(); toast(ok ? "已複製" : "複製失敗，請手動選取");
    }
  }
  // 對外分享用網址：代碼/（有專屬 LINE／FB 縮圖，打開後自動進 ?c=代碼）。新增社區要跑 tools/make_share.py
  const regUrl = code => new URL("./" + encodeURIComponent(code) + "/", location.href).href;
  const fmtPhone = p => /^09\d{8}$/.test(p) ? p.slice(0,4) + "-" + p.slice(4,7) + "-" + p.slice(7) : p;

  async function load(cred){
    const r = await fetch(API, {method:"POST", body: JSON.stringify(Object.assign({action:"data"}, cred)), credentials:"omit"});
    return r.json();
  }

  function errText(r){
    return r.error === "wrong_key" ? "密碼不對，請再確認一次"
      : r.error === "locked" ? "錯誤次數太多，請 10 分鐘後再試"
      : r.error === "not_admin" ? "這個 Google 帳號（" + (r.email || "") + "）不在協會成員名單裡，請洽系統管理員加入。"
      : r.error === "google_invalid" ? "Google 登入已過期，請再按一次「使用 Google 帳戶登入」"
      : "讀取失敗，請稍後再試";
  }

  async function login(cred, silent){
    const google = !!cred.idToken;
    const err = google ? $("#g-err") : $("#login-err");
    $("#g-err").hidden = true; $("#login-err").hidden = true;
    if (!API) { err.textContent = "尚未設定 API 網址（config.js 的 API_URL）"; err.hidden = false; return; }
    const btn = $("#login-btn");
    if (google) { err.textContent = "登入中…"; err.hidden = false; err.style.color = "var(--muted)"; }
    else { btn.disabled = true; btn.textContent = "登入中…"; }
    try {
      const r = await load(cred);
      err.style.color = "";
      if (!r.ok) {
        ss.del();
        if (!silent) { err.textContent = errText(r); err.hidden = false; } else err.hidden = true;
        return;
      }
      err.hidden = true;
      CRED = cred; ss.set(cred); DATA = r; DATA.at = new Date();
      $("#login").hidden = true; $("#app").hidden = false;
      $("#refresh").hidden = false; $("#logout").hidden = false;
      render();
    } catch(e) {
      err.style.color = "";
      if (!silent) { err.textContent = "網路連線失敗，請稍後再試"; err.hidden = false; } else err.hidden = true;
    } finally {
      btn.disabled = false; btn.textContent = "登入";
    }
  }

  $("#login").addEventListener("submit", e => { e.preventDefault(); const k = $("#key").value.trim(); if (k) login({key:k}); });
  $("#logout").addEventListener("click", () => {
    ss.del();
    try { if (CRED && CRED.idToken && window.google) google.accounts.id.disableAutoSelect(); } catch(e) {}
    location.reload();
  });

  // ---- 管理者 Google 登入（Google Identity Services）----
  function initGoogle(){
    const box = $("#g-btn");
    if (!CFG.GOOGLE_CLIENT_ID) { box.parentElement.hidden = true; return; }
    let tries = 0;
    (function wait(){
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({
          client_id: CFG.GOOGLE_CLIENT_ID,
          callback: resp => { if (resp && resp.credential) login({idToken: resp.credential}); },
          ux_mode: "popup", auto_select: false, cancel_on_tap_outside: true
        });
        box.innerHTML = "";
        google.accounts.id.renderButton(box, {type:"standard", theme:"filled_blue", size:"large", shape:"pill", text:"signin_with", locale:"zh-TW", width: 280});
      } else if (++tries < 60) setTimeout(wait, 250);
      else box.innerHTML = '<span class="muted">Google 登入載入失敗，請重新整理頁面</span>';
    })();
  }
  if (CFG.ORG_NAME) $("#org-name").textContent = CFG.ORG_NAME;
  initGoogle();
  $("#refresh").addEventListener("click", async () => {
    const b = $("#refresh"); b.disabled = true; b.textContent = "更新中…";
    try {
      const r = await load(CRED);
      if (r.ok) { DATA = r; DATA.at = new Date(); render(); toast("已更新"); }
      else if (r.error === "google_invalid") {
        ss.del(); $("#app").hidden = true; $("#login").hidden = false;
        $("#refresh").hidden = true; $("#logout").hidden = true; $("#role").hidden = true;
        $("#g-err").textContent = errText(r); $("#g-err").hidden = false;
      } else toast("更新失敗");
    }
    catch(e) { toast("網路連線失敗"); }
    b.disabled = false; b.textContent = "更新";
  });

  function rowsInView(){
    const q = $("#q").value.trim().toLowerCase().replace(/-/g, "");
    return DATA.rows.filter(r => (FILTER === "all" || r.code === FILTER) &&
      (!q || [r.name, r.phone].some(s => String(s || "").toLowerCase().includes(q))));
  }

  function render(){
    const admin = DATA.role === "admin";
    const role = $("#role"); role.hidden = false;
    role.textContent = admin ? (DATA.who ? "協會成員｜" + DATA.who : "管理者｜全部社區") : DATA.communities.map(c => c.name).join("、");
    document.title = "報名後台｜" + role.textContent;

    // 社區卡片（管理者）
    $("#comm-card").hidden = !admin;
    $("#chips").hidden = !admin || DATA.communities.length < 2;
    if (admin) {
      const box = $("#comms"); box.innerHTML = "";
      DATA.communities.forEach(c => {
        const url = regUrl(c.code);
        const short = ((CFG.COMMUNITIES || {})[c.code] || {}).short || "";  // 縮網址（config.js 的 short）
        const kv = el("dl", {className:"kv"});
        [["時間", c.time], ["地點", c.place], ["縮網址", short], ["報名頁", url]].forEach(([k, v]) => {
          if (v) kv.append(el("dt", {textContent:k}), el("dd", {textContent:v}));
        });
        // 對外貼文用：社區、時間、地點、報名連結（有縮網址就用縮網址）
        const msg = (CFG.EVENT_TITLE || "") + "｜" + c.name + "\n" + (c.time ? "時間：" + c.time + "\n" : "") + (c.place ? "地點：" + c.place + "\n" : "") + "報名：" + (short || url);
        box.append(el("div", {className:"comm"},
          el("div", {className:"comm-h"},
            el("h3", {textContent:c.name}),
            el("span", {className:"tag " + (c.open ? "on" : "off"), textContent: c.open ? "開放報名" : "已截止"}),
            c.line ? null : el("span", {className:"tag warn", textContent:"未設 LINE 群組"}),
            el("span", {className:"cnt num", textContent: c.count + (c.cap ? " / " + c.cap : "") + " 人"})),
          kv,
          el("div", {className:"row-btns"},
            short ? btn("複製縮網址", () => copy(short)) : null,
            btn("複製報名連結", () => copy(url)),
            btn("報名 QR", () => openQr(c.name, short || url, c.code)),
            btn("複製報名訊息", () => copy(msg)),
            el("a", {className:"btn btn-ghost btn-sm", href:url, target:"_blank", rel:"noopener", textContent:"開啟報名頁"}),
            sheetUrl(c.code) ? el("a", {className:"btn btn-sheet btn-sm", href:sheetUrl(c.code), target:"_blank", rel:"noopener", textContent:"開啟試算表名單"}) : null)
        ));
      });
      // 篩選
      const chips = $("#chips"); chips.innerHTML = "";
      [["all", "全部"]].concat(DATA.communities.map(c => [c.code, c.name])).forEach(([code, name]) => {
        const n = code === "all" ? DATA.rows.length : DATA.rows.filter(r => r.code === code).length;
        const b = el("button", {type:"button", className:"chip", textContent: name + " " + n});
        b.setAttribute("aria-pressed", String(FILTER === code));
        b.addEventListener("click", () => { FILTER = code; render(); });
        chips.append(b);
      });
    } else {
      // 社區負責人：自己社區的資訊
      const c = DATA.communities[0];
      $("#mine-card").hidden = !c;
      if (c) {
        $("#mine-title").textContent = c.name;
        const kv = $("#mine-kv"); kv.innerHTML = "";
        [["時間", c.time], ["地點", c.place], ["報名頁", regUrl(c.code)], ["狀態", c.open ? "開放報名中" : "已截止"]].forEach(([k, v]) => {
          if (v) kv.append(el("dt", {textContent:k}), el("dd", {textContent:v}));
        });
        kv.append(el("dt", {textContent:""}), el("dd", {}, el("div", {className:"row-btns"},
          btn("複製報名連結", () => copy(regUrl(c.code))), btn("報名 QR", () => openQr(c.name, regUrl(c.code), c.code)))));
      }
    }

    renderList();
  }

  function btn(t, fn){ const b = el("button", {type:"button", className:"btn btn-ghost btn-sm", textContent:t}); b.addEventListener("click", fn); return b; }

  // 管理者：對應的 Google 試算表分頁（全部 → 報名總表；某社區 → 名單｜該社區）
  function sheetUrl(code){
    if (!DATA || !DATA.sheet || !DATA.sheet.url) return "";
    const c = code && code !== "all" ? DATA.communities.find(x => x.code === code) : null;
    const gid = c && c.gid != null ? c.gid : DATA.sheet.gid;
    return DATA.sheet.url.replace(/#.*$/, "") + "#gid=" + gid;
  }

  function renderList(){
    const sb = $("#sheet-btn"), su = sheetUrl(FILTER);
    sb.hidden = !su;
    if (su) {
      sb.href = su;
      const c = DATA.communities.find(x => x.code === FILTER);
      sb.textContent = c ? "開啟試算表（" + c.name.replace(/社區發展協會$/, "") + "）" : "開啟 Google 試算表";
    }
    const admin = DATA.role === "admin";
    const rows = rowsInView();
    const scope = DATA.rows.filter(r => FILTER === "all" || r.code === FILTER);

    // 統計（依目前篩選的社區，不受搜尋影響）
    const g = k => scope.filter(r => r.gender === k).length;
    const ages = scope.map(r => Number(r.age)).filter(a => a > 0);
    const band = (lo, hi) => ages.filter(a => a >= lo && a <= hi).length;
    const st = $("#stats"); st.innerHTML = "";
    [["報名人數", scope.length, "人"],
     ["男／女", g("男") + "／" + g("女"), g("不便透露") ? "不便透露 " + g("不便透露") : ""],
     ["65 歲以上", band(65, 200), "18–64 歲 " + band(18, 64)],
     ["17 歲以下", band(0, 17), ages.length ? "平均 " + (ages.reduce((a, b) => a + b, 0) / ages.length).toFixed(0) + " 歲" : ""]
    ].forEach(([k, v, s]) => st.append(el("div", {className:"stat"}, el("small", {textContent:k}), el("b", {className:"num", textContent:v}), el("span", {textContent:s}))));

    $("#updated").textContent = "共 " + rows.length + " 筆" + (rows.length !== scope.length ? "（搜尋結果）" : "") +
      "｜資料時間 " + DATA.at.toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"});

    const list = $("#list"); list.innerHTML = "";
    if (!rows.length) { list.append(el("li", {className:"empty", textContent: scope.length ? "找不到符合的資料" : "目前還沒有人報名"})); return; }
    rows.slice().reverse().forEach(r => {
      list.append(el("li", {className:"item"},
        el("span", {className:"no", textContent:"#" + r.no}),
        el("div", {className:"who"},
          el("b", {textContent:r.name}),
          el("span", {textContent:[r.gender, r.age ? r.age + " 歲" : ""].filter(Boolean).join("・")}),
          admin && FILTER === "all" ? el("span", {className:"cn", textContent:r.cname}) : null),
        el("a", {className:"tel", href:"tel:" + r.phone, textContent:fmtPhone(r.phone)}),
        el("div", {className:"meta"},
          el("span", {textContent:"報名 " + String(r.time).slice(5, 16)}))
      ));
    });
  }

  $("#q").addEventListener("input", () => DATA && renderList());

  $("#csv").addEventListener("click", () => {
    const rows = rowsInView();
    const head = ["報名編號", "社區", "姓名", "性別", "年齡", "手機", "報名時間"];
    const esc = v => { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    // 手機加 ="..." 讓 Excel 保留開頭的 0
    const lines = [head.join(",")].concat(rows.map(r => [r.no, r.cname, r.name, r.gender, r.age, '="' + r.phone + '"', r.time].map((v, i) => i === 5 ? v : esc(v)).join(",")));
    const blob = new Blob(["﻿" + lines.join("\r\n")], {type:"text/csv;charset=utf-8"});
    const name = (DATA.role === "admin" && FILTER === "all" ? "全部社區" : (DATA.communities.find(c => c.code === (FILTER === "all" ? DATA.communities[0].code : FILTER)) || {}).name || "報名") +
      "_報名名單_" + new Date().toISOString().slice(0, 10) + ".csv";
    const a = el("a", {href:URL.createObjectURL(blob), download:name}); document.body.append(a); a.click(); a.remove();
  });

  $("#phones").addEventListener("click", () => {
    const rows = rowsInView();
    if (!rows.length) return toast("沒有資料");
    copy(rows.map(r => r.name + " " + fmtPhone(r.phone)).join("\n"));
  });

  // QR
  const dlg = $("#qr-dlg");
  function openQr(name, url, code){
    $("#qr-title").textContent = name;
    $("#qr-url").textContent = url;
    try {
      const q = qrcode(0, "M"); q.addData(url); q.make();
      $("#qr-big").innerHTML = q.createSvgTag({cellSize:8, margin:2, scalable:true});
      $("#qr-dl").href = q.createDataURL(10, 4);
      $("#qr-dl").download = name + "_報名QR.gif";
    } catch(e) { $("#qr-big").textContent = "QR 產生失敗"; }
    try { dlg.showModal(); } catch(e) {}
  }
  $("#qr-close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

  const saved = ss.get();
  if (saved && (saved.key || saved.idToken)) login(saved, true);
})();
</script>
</body>
</html>
